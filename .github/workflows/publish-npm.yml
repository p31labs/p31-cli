name: Publish npm Package

'on':
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 3.1.6)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm with Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit || true

      - name: Test
        run: npm test

      - name: Verify tool manifest
        run: node scripts/verify-tool-manifest.mjs

      - name: Build
        run: npm run build

      - name: Publish with provenance (OIDC — no NODE_AUTH_TOKEN)
        run: npm publish --access public --provenance

      - name: Verify provenance attestation
        run: |
          sleep 30
          npm view @p31ca/cli@${{ github.event.release.tag_name || inputs.version }} dist.attestations || true
